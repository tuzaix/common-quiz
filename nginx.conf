server {
    listen 80;
    server_name your_domain.com; # 替换为你的域名或服务器IP

    # 前端静态资源托管
    location / {
        root /var/www/common-quiz/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html; # 支持 Vue Router 的 history 模式
    }

    # 后端接口反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3870; # 假设后端运行在 3870 端口
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前端静态封面图 (存储在 frontend/dist/covers)
    location /covers/ {
        root /var/www/common-quiz/frontend/dist;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 后端上传文件静态资源 (如生成的分享图二维码)
    location /uploads/ {
        alias /var/www/common-quiz/backend/data/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 开启 Gzip 压缩优化
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}
