<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb7185;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- 背景圆形 -->
  <circle cx="128" cy="128" r="120" fill="white" />
  <circle cx="128" cy="128" r="110" fill="none" stroke="url(#logo-gradient)" stroke-width="8" stroke-dasharray="20,10" />
  
  <!-- 核心图标：带问号的对话框/搜索 -->
  <g filter="url(#shadow)">
    <path d="M70,80 Q70,60 90,60 L166,60 Q186,60 186,80 L186,140 Q186,160 166,160 L140,160 L110,190 L110,160 L90,160 Q70,160 70,140 Z" fill="url(#logo-gradient)" />
    <!-- 问号符号 -->
    <path d="M118,95 Q118,85 128,85 Q138,85 138,95 Q138,102 132,106 Q128,110 128,118 M128,130 L128,132" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" />
  </g>
  
  <!-- 装饰星光 -->
  <path d="M200,60 L204,70 L214,74 L204,78 L200,88 L196,78 L186,74 L196,70 Z" fill="#fb7185">
    <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite" />
  </path>
</svg>
